<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;height:844px;width:390px;overflow:hidden;font-family:system-ui,sans-serif;color:#2a1747}
body{background:url(art/story_bg.png) center/cover no-repeat;background-color:#1b1030}
body::before{content:"";position:absolute;inset:0;background:rgba(255,246,235,.25)}
.wrap{position:relative;height:844px;padding:54px 18px 24px;display:flex;flex-direction:column}
.hud{display:flex;gap:10px;justify-content:space-between;align-items:center}
.chip{height:52px;min-width:52px;padding:0 14px;border-radius:26px;display:flex;align-items:center;justify-content:center;gap:4px;background:rgba(255,255,255,.86);box-shadow:0 0 0 2px #ff8a1f55,0 6px 16px #0005;border:0}
.chip.wide{flex:1}.stars span{display:inline-block;margin:0 2px}.stars .off{opacity:.3;filter:grayscale(1)}
h1{margin:14px 2px 0;font-size:28px;font-weight:900;text-shadow:0 2px 0 #0007,0 0 14px #ff8a1faa}
.sub{margin:2px 2px 12px;font-size:14px;opacity:.95;text-shadow:0 1px 4px #000a}
.board{background:rgba(255,255,255,.86);border-radius:28px;padding:14px;box-shadow:0 0 30px #ff8a1f77,inset 0 0 0 2px #ff8a1f88}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{aspect-ratio:1;border-radius:18px;background:linear-gradient(160deg,var(--a),var(--b));display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#fff;box-shadow:0 6px 0 #0007,0 0 16px var(--a)88;text-shadow:0 2px 0 #0006}
.lamps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.lamp{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#4a3a66,#1b1030);box-shadow:inset 0 0 0 2px #fff2}
.lamp.lit{background:radial-gradient(circle,#fff6c4,var(--a) 55%,var(--b));box-shadow:0 0 22px var(--a)}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center}
.prompt{align-self:stretch;margin:14px 0 0;padding:12px 14px;border-radius:20px;background:rgba(255,255,255,.86);font-size:16px;font-weight:700;text-align:center}
.row{display:flex;justify-content:center;align-items:center;gap:22px;margin-top:auto}
.big{width:84px;height:84px;border-radius:30px;border:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(165deg,#ffb347,#ff6a00);box-shadow:0 0 26px #ff8a1f99,0 7px 0 #8a3600;}
.big.purple{background:linear-gradient(165deg,#b98cff,#5b2a86);box-shadow:0 0 26px #b98cff99,0 7px 0 #2d1450}
.ghost{width:60px;height:60px;border-radius:22px;border:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.86);box-shadow:0 0 0 2px #ff8a1f66,0 5px 0 #0006}
.ghost svg path,.ghost svg rect,.ghost svg circle{}
</style></head><body><div class="wrap">
<div class="hud"><button class="chip"><svg viewBox="0 0 24 24" width="26" height="26"><rect x="6" y="5" width="4" height="14" rx="1" fill="#fff"/><rect x="14" y="5" width="4" height="14" rx="1" fill="#fff"/></svg></button><div class="chip wide"><span class="stars"><span class="on"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.8 5.7 21l1.5-7L2 9.3l7-.8z" fill="#ffd54a" stroke="#fff" stroke-width="1"/></svg></span><span class="on"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.8 5.7 21l1.5-7L2 9.3l7-.8z" fill="#ffd54a" stroke="#fff" stroke-width="1"/></svg></span><span class="off"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.8 5.7 21l1.5-7L2 9.3l7-.8z" fill="#ffd54a" stroke="#fff" stroke-width="1"/></svg></span></span></div><div class="chip"><span class="lives"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="#ff5c7a" stroke="#fff" stroke-width="1"/></svg><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="#ff5c7a" stroke="#fff" stroke-width="1"/></svg><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="#ff5c7a" stroke="#fff" stroke-width="1"/></svg></span></div></div>
<h1>Story Mosaic</h1><div class="sub">Put the scene back together</div>
<div class="mid"><div class="board grid3"><div class="tile mosaic" style="--a:#ff8a1f;--b:#7a2fc0;opacity:1"></div><div class="tile mosaic" style="--a:#ff8a1f;--b:#7a2fc0;opacity:1"></div><div class="tile mosaic" style="--a:#ff8a1f;--b:#7a2fc0;opacity:1"></div><div class="tile mosaic" style="--a:#ff8a1f;--b:#7a2fc0;opacity:1"></div><div class="tile mosaic" style="--a:#ff8a1f;--b:#7a2fc0;opacity:0.35"></div><div class="tile mosaic" style="--a:#ff8a1f;--b:#7a2fc0;opacity:0.35"></div><div class="tile mosaic" style="--a:#ff8a1f;--b:#7a2fc0;opacity:0.35"></div><div class="tile mosaic" style="--a:#ff8a1f;--b:#7a2fc0;opacity:0.35"></div><div class="tile mosaic" style="--a:#ff8a1f;--b:#7a2fc0;opacity:0.35"></div></div><div class="prompt">Tap the tiles in story order</div></div>
<div class="row"><button class="ghost"><svg viewBox="0 0 24 24" width="30" height="30"><path d="M9 18h6M10 21h4" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z" fill="#ffe27a" stroke="#fff" stroke-width="1.5"/></svg></button><button class="big"><svg viewBox="0 0 24 24" width="34" height="34"><path d="M8 5v14l11-7z" fill="#fff"/></svg></button><button class="ghost"><svg viewBox="0 0 24 24" width="30" height="30"><path d="M4 12a8 8 0 1 0 2.4-5.7" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M4 4v5h5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
</div></body></html>
