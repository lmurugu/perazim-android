<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;height:844px;width:390px;overflow:hidden;font-family:system-ui,sans-serif;color:#fff}
body{background:url(art/story_bg.png) center/cover no-repeat;background-color:#1b1030;position:relative}
body::before{content:"";position:absolute;inset:0;background:rgba(20,8,40,.55)}
.wrap{position:relative;height:844px;padding:54px 18px 24px;display:flex;flex-direction:column}
.hud{display:flex;gap:10px;align-items:center}
.chip{height:52px;min-width:52px;padding:0 14px;border-radius:26px;display:flex;align-items:center;justify-content:center;gap:4px;background:rgba(20,10,40,.72);box-shadow:0 0 0 2px #8b5cf655,0 6px 16px #0005;border:0}
.chip.wide{flex:1}.chip.glyph svg path,.chip.glyph svg rect{}
h1{margin:10px 2px 0;font-size:26px;font-weight:900;text-shadow:0 2px 0 #0007,0 0 14px #b98cffaa}
.sub{margin:2px 2px 10px;font-size:14px;text-shadow:0 1px 4px #000a}
.board{background:rgba(20,10,40,.72);border-radius:28px;padding:14px;box-shadow:0 0 30px #b98cff77,inset 0 0 0 2px #b98cff88}
.cw{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:50px;gap:4px}
.cell{aspect-ratio:1;border-radius:8px;background:#fff;color:#2a1747;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px #8b5cf6}
.cell.dark{background:transparent;box-shadow:none}.cell.ok{background:linear-gradient(160deg,#8bc34a,#2e7d32);color:#fff}
.wheel{position:relative;width:200px;height:200px;margin:14px auto 0;border-radius:50%;background:radial-gradient(circle,#ffffffcc,#ffffff44 70%);box-shadow:0 0 30px #b98cff99,inset 0 0 0 2px #b98cff}
.wl{position:absolute;width:52px;height:52px;margin:-26px;border-radius:50%;background:linear-gradient(160deg,#b98cff,#5b2a86);color:#fff;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 #2d1450,0 0 14px #b98cff99}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tileA{min-height:78px;border-radius:24px;border:0;background:linear-gradient(165deg,#b98cff,#5b2a86);color:#fff;font-size:20px;font-weight:900;box-shadow:0 7px 0 #2d1450,0 0 20px #b98cff88;display:flex;align-items:center;justify-content:center;text-shadow:0 2px 0 #0006}
.row{display:flex;justify-content:center;align-items:center;gap:22px;margin-top:auto}
.big{width:84px;height:84px;border-radius:30px;border:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(165deg,#ffb347,#ff6a00);box-shadow:0 0 26px #ff8a1f99,0 7px 0 #8a3600}
.ghost{width:60px;height:60px;border-radius:22px;border:0;display:flex;align-items:center;justify-content:center;background:rgba(20,10,40,.72);box-shadow:0 0 0 2px #8b5cf666,0 5px 0 #0006}
.hintbtn{width:100%;height:58px;border-radius:24px;border:0;display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(165deg,#ffb347,#ff6a00);color:#fff;font-weight:800;font-size:17px;box-shadow:0 0 22px #ff8a1f88,0 6px 0 #8a3600;margin-top:12px}
</style></head><body><div class="wrap"><div class="hud"><button class="chip"><svg viewBox="0 0 24 24" width="26" height="26"><rect x="6" y="5" width="4" height="14" rx="1" fill="#fff"/><rect x="14" y="5" width="4" height="14" rx="1" fill="#fff"/></svg></button><div class="chip wide"><span style="margin:0 2px;opacity:0.3"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.8 5.7 21l1.5-7L2 9.3l7-.8z" fill="#ffd54a" stroke="#fff" stroke-width="1"/></svg></span><span style="margin:0 2px;opacity:0.3"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.8 5.7 21l1.5-7L2 9.3l7-.8z" fill="#ffd54a" stroke="#fff" stroke-width="1"/></svg></span><span style="margin:0 2px;opacity:0.3"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.8 5.7 21l1.5-7L2 9.3l7-.8z" fill="#ffd54a" stroke="#fff" stroke-width="1"/></svg></span></div><div class="chip"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="#ff5c7a" stroke="#fff" stroke-width="1"/></svg><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="#ff5c7a" stroke="#fff" stroke-width="1"/></svg><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="#ff5c7a" stroke="#fff" stroke-width="1"/></svg></div></div><h1>Bible Quiz</h1><div class="sub">Question 1 of 5</div><div class="board" style="font-size:22px;font-weight:800;text-align:center;padding:22px 16px">Who climbed a sycamore tree to see Jesus?</div><div class="ans"><button class="tileA">Nicodemus</button><button class="tileA">Peter</button><button class="tileA">Thomas</button><button class="tileA">Zacchaeus</button></div><button class="hintbtn"><svg viewBox="0 0 24 24" width="30" height="30"><path d="M9 18h6M10 21h4" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z" fill="#ffe27a" stroke="#fff" stroke-width="1.5"/></svg>Show a hint</button><div class="row" style="margin-top:14px"><button class="ghost"><svg viewBox="0 0 24 24" width="28" height="28"><path d="M4 12a8 8 0 1 0 2.4-5.7" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/><path d="M4 4v5h5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div></body></html>
