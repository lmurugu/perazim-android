name: Backend

on:
  push:
    branches: [main, phase-B-community]
    paths: ["server/**", ".github/workflows/backend.yml"]
  pull_request:
    branches: [main, phase-B-community]
    paths: ["server/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Migrations and server suites on PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-jwt-secret-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Run each suite on its own fresh migrated database
        env:
          PGPASSWORD: ci-only-password
        run: |
          set -e
          for t in api postgres migration_sync_receipts_existing_data logging_privacy_scan community_api prayer_visibility privacy_privacy_gate privacy_ack_contract erasure_cascade migration_0007_guard; do
            db="ci_${t}_test"
            psql -h 127.0.0.1 -U postgres -qc "DROP DATABASE IF EXISTS $db" -c "CREATE DATABASE $db"
            DATABASE_URL="postgres://postgres:ci-only-password@127.0.0.1:5432/$db" node test/$t.test.js
          done
      - name: Isolated phase-B runner
        env:
          PGPASSWORD: ci-only-password
        run: bash scripts/test-phase-b-isolated.sh
        working-directory: server
  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image
        run: docker build -t perazim-server:ci server
