name: legal-docs

on:
  pull_request:
    paths:
      - "docs/legal/**"
      - "scripts/check_legal_docs.sh"
  push:
    branches: [phase-B-community, main]
    paths:
      - "docs/legal/**"
      - "scripts/check_legal_docs.sh"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash scripts/check_legal_docs.sh
