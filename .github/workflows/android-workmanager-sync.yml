name: Background Sync WorkManager Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  background-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Test background sync scheduler on API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: bash server/test/workmanager_recovery_ci.sh
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: background-sync-instrumentation-reports
          path: build/outputs/androidTest-results/connected/**/*.xml
          if-no-files-found: warn
