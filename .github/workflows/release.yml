name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release:
    name: Build release bundle (signing and Play upload need owner secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Fail unless the release backend URL is set
        env:
          API_BASE_URL: ${{ secrets.PERAZIM_RELEASE_API_BASE_URL }}
        run: test -n "$API_BASE_URL" || { echo "Set the PERAZIM_RELEASE_API_BASE_URL secret (owner action)."; exit 1; }
      - name: Build release bundle
        env:
          API_BASE_URL: ${{ secrets.PERAZIM_RELEASE_API_BASE_URL }}
        run: ./gradlew bundleRelease --no-daemon -PperazimPilotApiBaseUrl="$API_BASE_URL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-release-bundle
          path: build/outputs/bundle/release/*.aab
  server-image:
    name: Build server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build server image
        run: docker build -t ghcr.io/${{ github.repository }}/server:${{ github.ref_name }} server
