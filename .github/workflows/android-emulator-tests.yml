name: Android Database Instrumentation Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-instrumentation:
    name: SQLCipher and Room migration suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Run database instrumentation suites on API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: >-
            ./gradlew connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=org.perazimchurch.app.data.local.DatabaseEncryptionMigrationTest,org.perazimchurch.app.data.local.PerazimDatabaseMigrationTest
            --stacktrace
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: database-instrumentation-reports
          path: |
            build/outputs/androidTest-results/connected/**/*.xml
            build/reports/androidTests/connected/**
          if-no-files-found: warn
