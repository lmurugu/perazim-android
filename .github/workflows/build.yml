name: Android CI Build

on:
  push:
    branches:
      - main
      - master
      - "phase-3/community-fellowship"
      - "phase-**"
  pull_request:
    branches:
      - main
      - master
      - "phase-3/community-fellowship"
      - "phase-**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build and inspect unsigned CI Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Assert release artifact is unsigned in CI
        run: |
          test ! -e keystore.properties
          test -f build/outputs/apk/release/app-release-unsigned.apk
          test ! -e build/outputs/apk/release/app-release.apk

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/testDebugUnitTest/"
          if-no-files-found: warn

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: perazim-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: warn

      - name: Upload unsigned CI release (NOT FOR DISTRIBUTION)
        uses: actions/upload-artifact@v7
        with:
          name: perazim-ci-unsigned-release-NOT-FOR-DISTRIBUTION
          path: "build/outputs/apk/release/app-release-unsigned.apk"
          if-no-files-found: error
