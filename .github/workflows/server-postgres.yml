name: Server PostgreSQL Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-tests:
    name: Server tests on disposable PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: perazim_test
          POSTGRES_PASSWORD: perazim_test
          POSTGRES_DB: perazim_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perazim_test -d perazim_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://perazim_test:perazim_test@127.0.0.1:5432/perazim_ci_test
      NODE_ENV: test
      JWT_SECRET: ci-only-synthetic-secret-not-for-deployment
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Initialize disposable schema and apply migrations in order
        env:
          PGPASSWORD: perazim_test
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f server/schema.sql
          for migration in server/migrations/*.sql; do
            echo "Applying ${migration}"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Run all server tests
        working-directory: server
        run: npm test
