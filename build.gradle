plugins { id 'com.android.application' version '8.2.2' }

def keystorePropertiesFile = file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Explicit API origin injection; an omitted property leaves the variant offline.
def configuredApiBaseUrl = { String propertyName, boolean allowLocalHttp, boolean pilotProduction ->
    def value = providers.gradleProperty(propertyName).orElse('').get().trim()
    if (!value) return ''
    def uri
    try {
        uri = new java.net.URI(value)
    } catch (java.net.URISyntaxException ignored) {
        throw new GradleException("Invalid URL for ${propertyName}")
    }
    def host = uri.host?.toLowerCase(java.util.Locale.ROOT)
    def loopback = host in ['localhost', '127.0.0.1', '10.0.2.2']
    def permittedHttp = allowLocalHttp && loopback && uri.scheme == 'http'
    if (!host || uri.rawUserInfo || uri.rawQuery || uri.rawFragment ||
            (uri.rawPath && uri.rawPath != '/') ||
            !(uri.scheme == 'https' || permittedHttp)) {
        throw new GradleException("${propertyName} must be an HTTPS origin (local debug may use HTTP loopback)")
    }
    if (pilotProduction && (loopback || uri.port != -1 || host.endsWith('.ts.net') ||
            host == 'trycloudflare.com' || host.endsWith('.trycloudflare.com') ||
            host.endsWith('.invalid'))) {
        throw new GradleException("Pilot release requires an approved stable public HTTPS origin")
    }
    return value.endsWith('/') ? value.substring(0, value.length() - 1) : value
}
def localApiBaseUrl = configuredApiBaseUrl('perazimLocalApiBaseUrl', true, false)
def validationApiBaseUrl = configuredApiBaseUrl('perazimValidationApiBaseUrl', false, false)
def pilotApiBaseUrl = configuredApiBaseUrl('perazimPilotApiBaseUrl', false, true)

android {
    namespace 'org.perazimchurch.app'
    compileSdk 34
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += ['**/*.so']
        }
    }
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "org.perazimchurch.app"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "2.2.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas"]
            }
        }

        // Unverified external feeds and AI relays must not be packaged in any APK variant.
        buildConfigField "boolean", "REMOTE_SHEET_FEEDS_ENABLED", "false"
        buildConfigField "boolean", "ONLINE_AI_ENABLED", "false"
        buildConfigField "boolean", "OFFLINE_QWEN_ENABLED", "false"
        buildConfigField "String", "API_BASE_URL", "\"\""
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            buildConfigField "String", "API_BASE_URL", groovy.json.JsonOutput.toJson(localApiBaseUrl)
        }
        validation {
            initWith debug
            applicationIdSuffix '.validation'
            versionNameSuffix '-pilot'
            matchingFallbacks = ['debug']
            buildConfigField "String", "API_BASE_URL", groovy.json.JsonOutput.toJson(validationApiBaseUrl)
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "API_BASE_URL", groovy.json.JsonOutput.toJson(pilotApiBaseUrl)
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    testBuildType 'validation'
    sourceSets {
        main {
            assets {
                exclude '**/member_contacts.csv'
            }
        }
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }
}

tasks.register('verifyReleaseApk') {
    group = 'verification'
    description = 'Inspect signed release or explicitly unsigned CI release APK'
    doLast {
        def releaseDir = layout.buildDirectory.dir('outputs/apk/release').get().asFile
        def signedApk = new File(releaseDir, 'app-release.apk')
        def unsignedApk = new File(releaseDir, 'app-release-unsigned.apk')
        if (signedApk.isFile() == unsignedApk.isFile()) {
            throw new GradleException('Expected exactly one release APK: signed OR unsigned')
        }
        def inspector = file('scripts/inspect_release_apk.py').absolutePath
        if (signedApk.isFile()) {
            if (!keystorePropertiesFile.exists() || !pilotApiBaseUrl) {
                throw new GradleException('Signed release requires release keystore and -PperazimPilotApiBaseUrl')
            }
            project.exec { commandLine 'python3', inspector, signedApk.absolutePath }
        } else {
            if (keystorePropertiesFile.exists()) {
                throw new GradleException('Release signing was configured but only an unsigned APK exists')
            }
            project.exec { commandLine 'python3', inspector, '--ci-unsigned', unsignedApk.absolutePath }
        }
    }
}

tasks.configureEach { task ->
    if (task.name == 'assembleRelease') {
        task.finalizedBy 'verifyReleaseApk'
    }
}

// Stop before asset merging if the private membership register is put back in
// an Android asset source directory. This check inspects filenames only; it
// never reads, copies, or deletes the register.
tasks.register('assertPrivateMembershipRegisterOutsideAndroidAssets') {
    doLast {
        def found = android.sourceSets.main.assets.srcDirs.any { assetDir ->
            assetDir.exists() && fileTree(assetDir).matching {
                include '**/member_contacts.csv'
            }.files.any()
        }
        if (found) {
            throw new GradleException('Private membership register must be stored outside Android asset directories')
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) {
        task.dependsOn 'assertPrivateMembershipRegisterOutsideAndroidAssets'
    }
}
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.zxing:core:3.5.3'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.room:room-testing:2.6.1'
}
