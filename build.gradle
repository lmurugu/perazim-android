plugins { id 'com.android.application' version '8.2.2' }

def keystorePropertiesFile = file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def sheetPropertiesFile = file("sheet_urls.properties")
def sheetProperties = new Properties()
if (sheetPropertiesFile.exists()) {
    sheetProperties.load(new FileInputStream(sheetPropertiesFile))
}

android {
    namespace 'org.perazimchurch.app'
    compileSdk 34
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "org.perazimchurch.app"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "2.2.0"

        buildConfigField "String", "SHEET_URL_ANNOUNCEMENTS", "\"${sheetProperties.getProperty('sheet_url_announcements', '')}\""
        buildConfigField "String", "SHEET_URL_EVENTS", "\"${sheetProperties.getProperty('sheet_url_events', '')}\""
        buildConfigField "String", "SHEET_URL_HYMNS", "\"${sheetProperties.getProperty('sheet_url_hymns', '')}\""
        buildConfigField "String", "SHEET_URL_RIDDLES", "\"${sheetProperties.getProperty('sheet_url_riddles', '')}\""
        buildConfigField "String", "SHEET_URL_JOKES", "\"${sheetProperties.getProperty('sheet_url_jokes', '')}\""
        buildConfigField "String", "SHEET_URL_SERMONS", "\"${sheetProperties.getProperty('sheet_url_sermons', '')}\""
        buildConfigField "String", "SHEET_URL_VERSES", "\"${sheetProperties.getProperty('sheet_url_verses', '')}\""
        buildConfigField "String", "SHEET_URL_CONFIG", "\"${sheetProperties.getProperty('sheet_url_config', '')}\""
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.zxing:core:3.5.3'
}
