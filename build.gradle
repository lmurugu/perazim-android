plugins { id 'com.android.application' version '8.2.2' }

def keystorePropertiesFile = file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def sheetPropertiesFile = file("sheet_urls.properties")
def sheetProperties = new Properties()
if (sheetPropertiesFile.exists()) {
    sheetProperties.load(new FileInputStream(sheetPropertiesFile))
}

def localPropertiesFile = file("local.properties")
def localProperties = new Properties()
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    namespace 'org.perazimchurch.app'
    compileSdk 34
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += ['**/*.so']
        }
    }
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "org.perazimchurch.app"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "2.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas"]
            }
        }

        buildConfigField "String", "SHEET_URL_ANNOUNCEMENTS", "\"${sheetProperties.getProperty('sheet_url_announcements', '')}\""
        buildConfigField "String", "SHEET_URL_EVENTS", "\"${sheetProperties.getProperty('sheet_url_events', '')}\""
        buildConfigField "String", "SHEET_URL_HYMNS", "\"${sheetProperties.getProperty('sheet_url_hymns', '')}\""
        buildConfigField "String", "SHEET_URL_RIDDLES", "\"${sheetProperties.getProperty('sheet_url_riddles', '')}\""
        buildConfigField "String", "SHEET_URL_JOKES", "\"${sheetProperties.getProperty('sheet_url_jokes', '')}\""
        buildConfigField "String", "SHEET_URL_SERMONS", "\"${sheetProperties.getProperty('sheet_url_sermons', '')}\""
        buildConfigField "String", "SHEET_URL_VERSES", "\"${sheetProperties.getProperty('sheet_url_verses', '')}\""
        buildConfigField "String", "SHEET_URL_CONFIG", "\"${sheetProperties.getProperty('sheet_url_config', '')}\""

        buildConfigField "String", "AI_RELAY_URL", "\"${localProperties.getProperty('ai_relay_url', 'https://perazim-ai-relay.perazim-mission.workers.dev/chat')}\""
        buildConfigField "String", "AI_APP_TOKEN", "\"${localProperties.getProperty('ai_app_token', '')}\""
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        validation {
            initWith debug
            applicationIdSuffix '.validation'
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    testBuildType 'validation'
    sourceSets {
        main {
            assets {
                exclude '**/member_contacts.csv'
            }
        }
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }
}

// Android Gradle Plugin 8.2 currently merges this source asset despite the
// source-set exclusion. Remove only this exact private file from every merged
// variant asset directory before AAPT packages the APK.
tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) {
        task.doLast {
            def variant = task.name.substring('merge'.length(), task.name.length() - 'Assets'.length()).toLowerCase(Locale.ROOT)
            def mergedAssets = layout.buildDirectory.dir("intermediates/assets/${variant}").get().asFile
            if (mergedAssets.isDirectory()) {
                fileTree(mergedAssets).matching { include '**/member_contacts.csv' }.files.each { privateAsset ->
                    if (!privateAsset.delete()) {
                        throw new GradleException('Unable to exclude the private membership asset from Android packaging')
                    }
                }
            }
        }
    }
}
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.zxing:core:3.5.3'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.room:room-testing:2.6.1'
}
