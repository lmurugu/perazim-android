plugins { id 'com.android.application' version '8.2.2' }

def keystorePropertiesFile = file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'org.perazimchurch.app'
    compileSdk 34
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += ['**/*.so']
        }
    }
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "org.perazimchurch.app"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "2.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas"]
            }
        }

        // Unverified external feeds and AI relays must not be packaged in any APK variant.
        buildConfigField "boolean", "REMOTE_SHEET_FEEDS_ENABLED", "false"
        buildConfigField "boolean", "ONLINE_AI_ENABLED", "false"
        buildConfigField "boolean", "OFFLINE_QWEN_ENABLED", "false"
        buildConfigField "String", "API_BASE_URL", "\"\""
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        validation {
            initWith debug
            applicationIdSuffix '.validation'
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "API_BASE_URL", "\"https://fedora.taile47793.ts.net\""
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    testBuildType 'validation'
    sourceSets {
        main {
            assets {
                exclude '**/member_contacts.csv'
            }
        }
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }
}

tasks.register('verifyReleaseApk', Exec) {
    def apk = layout.buildDirectory.file('outputs/apk/release/app-release.apk')
    inputs.file(apk)
    commandLine 'python3', file('scripts/inspect_release_apk.py').absolutePath, apk.get().asFile.absolutePath
}

tasks.configureEach { task ->
    if (task.name == 'assembleRelease') {
        task.finalizedBy 'verifyReleaseApk'
    }
}

// Stop before asset merging if the private membership register is put back in
// an Android asset source directory. This check inspects filenames only; it
// never reads, copies, or deletes the register.
tasks.register('assertPrivateMembershipRegisterOutsideAndroidAssets') {
    doLast {
        def found = android.sourceSets.main.assets.srcDirs.any { assetDir ->
            assetDir.exists() && fileTree(assetDir).matching {
                include '**/member_contacts.csv'
            }.files.any()
        }
        if (found) {
            throw new GradleException('Private membership register must be stored outside Android asset directories')
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) {
        task.dependsOn 'assertPrivateMembershipRegisterOutsideAndroidAssets'
    }
}
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.zxing:core:3.5.3'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.room:room-testing:2.6.1'
}
