plugins { id 'com.android.application' version '8.2.2' }

def keystorePropertiesFile = file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Backend origin for validation/release builds. Set `perazim.apiBaseUrl` in local.properties
// (see local.properties.example) or as a -P Gradle property. Empty by default, so no
// personal host is ever committed.
def localPropertiesFile = file("local.properties")
def localProperties = new Properties()
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}
def apiBaseUrl = localProperties.getProperty('perazim.apiBaseUrl') ?: (project.findProperty('perazim.apiBaseUrl') ?: '')

// Fail release builds that would ship without an HTTPS backend. Validation builds may stay empty.
gradle.taskGraph.whenReady { graph ->
    boolean releaseRequested = graph.allTasks.any { it.name ==~ /(assemble|bundle)Release/ }
    if (releaseRequested && !(apiBaseUrl ==~ /https:\/\/\S+/)) {
        throw new GradleException("perazim.apiBaseUrl must be an https:// URL for release builds. Set it in local.properties or with -Pperazim.apiBaseUrl=...")
    }
}

android {
    lint {
        baseline = file("lint-baseline.xml")
    }

    namespace 'org.perazimchurch.app'
    compileSdk 34
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += ['**/*.so']
        }
    }
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "org.perazimchurch.app"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "2.2.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas"]
            }
        }

        // Unverified external feeds and remote AI remain disabled in every variant.
        // Only the isolated validation build may run local Qwen for synthetic
        // device acceptance; debug/release builds retain the fail-closed default.
        buildConfigField "boolean", "REMOTE_SHEET_FEEDS_ENABLED", "false"
        buildConfigField "boolean", "ONLINE_AI_ENABLED", "false"
        buildConfigField "boolean", "OFFLINE_QWEN_ENABLED", "false"
        buildConfigField "String", "API_BASE_URL", "\"\""
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        validation {
            initWith debug
            applicationIdSuffix '.validation'
            versionNameSuffix '-pilot'
            matchingFallbacks = ['debug']
            buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
            buildConfigField "boolean", "OFFLINE_QWEN_ENABLED", "true"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    testBuildType 'validation'
    sourceSets {
        all {
            assets {
                exclude '**/member_contacts.csv'
            }
        }
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }
}

tasks.register('verifyReleaseApk', Exec) {
    def apk = layout.buildDirectory.file('outputs/apk/release/app-release.apk')
    inputs.file(apk)
    commandLine 'python3', file('scripts/inspect_release_apk.py').absolutePath, apk.get().asFile.absolutePath
}

tasks.configureEach { task ->
    if (task.name == 'assembleRelease') {
        task.finalizedBy 'verifyReleaseApk'
    }
}

// Stop before asset merging if the private membership register is put back in
// an Android asset source directory. This check inspects filenames only; it
// never reads, copies, or deletes the register.
tasks.register('assertPrivateMembershipRegisterOutsideAndroidAssets') {
    doLast {
        def found = android.sourceSets.any { sourceSet ->
            sourceSet.assets.srcDirs.any { assetDir ->
                assetDir.exists() && fileTree(assetDir).matching {
                    include '**/member_contacts.csv'
                }.files.any()
            }
        }
        if (found) {
            throw new GradleException('Private membership register must be stored outside Android asset directories')
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) {
        task.dependsOn 'assertPrivateMembershipRegisterOutsideAndroidAssets'
    }
}
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.zxing:core:3.5.3'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.room:room-testing:2.6.1'
}
